name: 更新牧場與部署 Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'test/**'
      - '.github/**'
  workflow_dispatch:
  schedule:
    # 臺北週一至週五 09:00–13:55，每 5 分鐘；13:35 起改為單次。
    # GitHub cron 可能延遲或漏跑；平日休市仍會執行。
    - cron: '*/5 1-5 * * 1-5'
    # 臺北週一至週五 14:20 收盤快照，僅執行一次，不循環。
    - cron: '20 6 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: 決定單次或循環模式
        id: mode
        run: node scripts/lib/loop-policy.mjs
      # run-cycle 首輪一律嘗試載入線上快照；失敗則完整擷取，成功則僅更新 MIS。
      - name: 載入線上快照、擷取第 1 輪並檢查
        run: node scripts/run-cycle.mjs --cycle 1
        env:
          MARKET_LOOP: ${{ steps.mode.outputs.loop }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs
          name: github-pages-1
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
        with:
          artifact_name: github-pages-1
      - name: 等待下一輪
        if: steps.mode.outputs.loop == 'true'
        run: sleep 15
      # 最多兩輪以符合 job 預算；第二輪失敗仍保留第一輪 Pages，讓 job 正常結束。
      # 依 outcome 串接，擷取失敗不發布舊快照，上傳失敗不嘗試部署。
      - name: 擷取第 2 輪（僅 MIS）
        id: cycle2
        if: steps.mode.outputs.loop == 'true'
        continue-on-error: true
        run: node scripts/run-cycle.mjs --cycle 2
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        id: upload2
        if: steps.mode.outputs.loop == 'true' && steps.cycle2.outcome == 'success'
        continue-on-error: true
        with:
          path: docs
          name: github-pages-2
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: steps.mode.outputs.loop == 'true' && steps.upload2.outcome == 'success'
        continue-on-error: true
        id: deployment2
        with:
          artifact_name: github-pages-2
