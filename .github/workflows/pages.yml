name: 更新牧場與部署 Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'test/**'
      - '.github/**'
  workflow_dispatch:
  schedule:
    # 臺北週一至週五 09:00–13:55，每 5 分鐘；13:35 起改為單次。
    # GitHub cron 可能延遲或漏跑；平日休市仍會執行。
    - cron: '*/5 1-5 * * 1-5'
    # 臺北週一至週五 14:20 收盤快照，僅執行一次，不循環。
    - cron: '20 6 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: 決定單次或循環模式
        id: mode
        run: node scripts/lib/loop-policy.mjs
      # run-cycle 首輪一律嘗試載入線上快照；失敗則完整擷取，成功則僅更新 MIS。
      - name: 載入線上快照、擷取第 1 輪並檢查
        run: node scripts/run-cycle.mjs --cycle 1
        env:
          MARKET_LOOP: ${{ steps.mode.outputs.loop }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          name: github-pages-1
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-1
      - name: 等待下一輪
        if: steps.mode.outputs.loop == 'true'
        run: sleep 15
      - name: 擷取第 2 輪（僅 MIS）
        if: steps.mode.outputs.loop == 'true'
        run: node scripts/run-cycle.mjs --cycle 2
      - uses: actions/upload-pages-artifact@v3
        if: steps.mode.outputs.loop == 'true'
        with:
          path: docs
          name: github-pages-2
      - uses: actions/deploy-pages@v4
        if: steps.mode.outputs.loop == 'true'
        id: deployment2
        with:
          artifact_name: github-pages-2
      - name: 等待下一輪
        if: steps.mode.outputs.loop == 'true'
        run: sleep 15
      - name: 擷取第 3 輪（僅 MIS）
        if: steps.mode.outputs.loop == 'true'
        run: node scripts/run-cycle.mjs --cycle 3
      - uses: actions/upload-pages-artifact@v3
        if: steps.mode.outputs.loop == 'true'
        with:
          path: docs
          name: github-pages-3
      - uses: actions/deploy-pages@v4
        if: steps.mode.outputs.loop == 'true'
        id: deployment3
        with:
          artifact_name: github-pages-3
