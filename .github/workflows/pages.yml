name: 更新牧場與部署 Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'test/**'
      - '.github/**'
  workflow_dispatch:
  schedule:
    # 臺北週一至週五 09:00–13:55，每 5 分鐘；13:35 起改為單次。
    # GitHub cron 可能延遲或漏跑；平日休市仍會執行。
    - cron: '*/5 1-5 * * 1-5'
    # 臺北週一至週五 14:20 收盤快照，僅執行一次，不循環。
    - cron: '20 6 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: docs/data/history.json
          key: cow-history-${{ github.run_id }}
          restore-keys: |
            cow-history-
      - name: 決定單次或循環模式
        id: mode
        run: node scripts/lib/loop-policy.mjs
      # run-cycle 首輪一律嘗試載入線上快照；失敗則完整擷取，成功則僅更新 MIS。
      - name: 載入線上快照、擷取第 1 輪並檢查
        run: node scripts/run-cycle.mjs --cycle 1
        env:
          MARKET_LOOP: ${{ steps.mode.outputs.loop }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
          name: github-pages-1
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        with:
          artifact_name: github-pages-1
      - name: 等待下一輪
        if: steps.mode.outputs.loop == 'true'
        run: sleep 15
      # 最多兩輪以符合 job 預算；第二輪失敗仍保留第一輪 Pages，讓 job 正常結束。
      # 依 outcome 串接，擷取失敗不發布舊快照，上傳失敗不嘗試部署。
      - name: 擷取第 2 輪（僅 MIS）
        id: cycle2
        if: steps.mode.outputs.loop == 'true'
        continue-on-error: true
        run: node scripts/run-cycle.mjs --cycle 2
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        id: upload2
        if: steps.mode.outputs.loop == 'true' && steps.cycle2.outcome == 'success'
        continue-on-error: true
        with:
          path: docs
          name: github-pages-2
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: steps.mode.outputs.loop == 'true' && steps.upload2.outcome == 'success'
        continue-on-error: true
        id: deployment2
        with:
          artifact_name: github-pages-2
